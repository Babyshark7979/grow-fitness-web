        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

        background: #1d111b;

        padding: 36px;
        text-align: center;
        max-width: 350px;
        width: 90%;
      }

        font-size: 1.1rem;
        font-weight: 800;
        margin: 0;
      }

      }

        width: 100%;

        background: #170d14;
        border: 1px solid #533046;

        border-radius: 999px;
        padding: 12px 16px;
        text-align: center;
        font-size: 1.15rem;
        letter-spacing: 0.3em;
      }
      button {
        width: 100%;
        background: #ff2e88;
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 13px;
        font-weight: 700;
        font-family: inherit;
        font-size: 0.95rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      .err {
        color: #ff7575;
        font-size: 0.82rem;
        min-height: 1.2em;
        margin-top: 8px;
      }
      #frame {
        border: 0;
        width: 100%;
        height: 100vh;
        display: none;
      }
    </style>

    <div id="g">
      <div class="box">
        <h1>So Tai Chinh Grow Fitness</h1>
        <p>
          Tai lieu noi bo ma hoa AES-256. Khong co mat khau, noi dung chi la du lieu loan &mdash; ke ca khi xem ma nguon
          trang.
        </p>
        <input
          id="pw"
          type="password"
          placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"
          inputmode="numeric"
          autofocus
        />
        <button id="btn">Giai ma &amp; mo so</button>
        <div class="err" id="err"></div>
      </div>
    </div>

      async function unlock() {
        const btn = document.getElementById('btn'),
          err = document.getElementById('err');
        btn.disabled = true;
        err.textContent = 'Dang giai ma...';
        try {
          const raw = Uint8Array.from(atob(BLOB), (c) => c.charCodeAt(0));
          const salt = raw.slice(0, 16),
            iv = raw.slice(16, 28),
            ct = raw.slice(28);
          const pw = new TextEncoder().encode(document.getElementById('pw').value);
          const km = await crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveKey']);
          const key = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
            km,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );
          const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
          const html = new TextDecoder().decode(pt);
          const b = new Blob([html], { type: 'text/html' });
          location.replace(URL.createObjectURL(b));
        } catch (e) {
          err.textContent = 'Sai mat khau - thu lai.';
          btn.disabled = false;
        }
      }
      document.getElementById('btn').addEventListener('click', unlock);
      document.getElementById('pw').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') unlock();
      });
